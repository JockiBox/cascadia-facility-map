*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F0;color:#1a1a1a}
:root{--forest:#1B6B73;--gold:#C4922A;--forest-light:#2A9DA5;--cream:#F5F4F0}
.header{background:var(--forest);color:white;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:1000}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{font-weight:800;font-size:18px;letter-spacing:1px}
.header-logo span{color:var(--gold)}
.header-subtitle{font-size:12px;color:#a3d9d6;margin-top:2px}
.header-stats{display:flex;gap:20px}
.stat{text-align:center}
.stat-value{font-size:22px;font-weight:700}
.stat-label{font-size:10px;color:#a3d9d6;text-transform:uppercase;letter-spacing:1px}
.layout{display:flex;height:calc(100vh - 56px)}
.sidebar{width:360px;background:white;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.search-box{width:100%;padding:10px 14px 10px 36px;border:1px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;background:#fafaf8}
.search-box:focus{border-color:var(--forest)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af}
.filters{padding:12px 16px;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.filter-btn{padding:4px 12px;border-radius:20px;border:1px solid #e5e7eb;background:white;font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.filter-btn:hover{border-color:var(--forest)}
.filter-btn.active{background:var(--forest);color:white;border-color:var(--forest)}
.filter-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.filter-label{font-size:11px;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.facility-list{overflow-y:auto;flex:1;padding:8px 0}
.facility-item{padding:10px 16px;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.facility-item:hover{background:#f9fafb}
.facility-item.active{background:#f0fdf4;border-left-color:var(--forest)}
.facility-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.facility-info{flex:1;min-width:0}
.facility-name{font-size:13px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facility-meta{font-size:11px;color:#9ca3af;margin-top:1px}
.facility-type{font-size:10px;padding:2px 8px;border-radius:10px;background:#f3f4f6;color:#6b7280;flex-shrink:0}
.count-badge{font-size:11px;color:#6b7280;padding:8px 16px;text-align:center;border-bottom:1px solid #f3f4f6}
.map-container{flex:1;position:relative}
#map{width:100%;height:100%}
.facility-card{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);padding:16px 20px;z-index:800;min-width:300px;max-width:400px;display:none}
.facility-card.visible{display:block}
.card-header{display:flex;justify-content:space-between;align-items:start}
.card-name{font-size:16px;font-weight:700;color:var(--forest)}
.card-close{cursor:pointer;color:#9ca3af;font-size:18px;padding:0 4px}
.card-close:hover{color:#1a1a1a}
.card-meta{font-size:13px;color:#6b7280;margin-top:4px}
.card-badges{display:flex;gap:8px;margin-top:8px}
.card-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.marker-cluster-small{background-color:rgba(27,107,115,.3)}
.marker-cluster-small div{background-color:var(--forest);color:white;font-weight:700;font-size:13px}
.marker-cluster-medium{background-color:rgba(196,146,42,.3)}
.marker-cluster-medium div{background-color:var(--gold);color:white;font-weight:700;font-size:13px}
.marker-cluster-large{background-color:rgba(42,157,165,.3)}
.marker-cluster-large div{background-color:var(--forest-light);color:white;font-weight:700;font-size:14px}
@media(max-width:768px){.layout{flex-direction:column}.sidebar{width:100%;height:45vh;border-right:none;border-bottom:1px solid #e5e7eb}.map-container{height:55vh}.header-stats{display:none}.facility-card{min-width:unset;left:16px;right:16px;transform:none}}
</style>

document.getElementById('filteredCount').textContent=filtered.length+' facilities';
var list=document.getElementById('facilityList');list.innerHTML='';
filtered.forEach(f=>{var d=document.createElement('div');
d.className='facility-item'+(activeMarker===f.name?' active':'');
d.innerHTML='<div class="facility-dot" style="background:'+SC[f.state]+'"></div><div class="facility-info"><div class="facility-name">'+f.name+'</div><div class="facility-meta">'+f.city+', '+f.state+'</div></div><div class="facility-type">'+(TL[f.type]||f.type)+'</div>';
d.onclick=()=>selectFacility(f);list.appendChild(d)});
markers.clearLayers();
filtered.forEach(f=>{var m=L.circleMarker([f.lat,f.lng],{radius:activeMarker===f.name?10:7,fillColor:SC[f.state],color:'white',weight:2,opacity:1,fillOpacity:activeMarker===f.name?1:.85});
m.bindTooltip('<strong>'+f.name+'</strong><br>'+f.city+', '+f.state,{direction:'top',offset:[0,-8]});
m.on('click',()=>selectFacility(f));markers.addLayer(m)});
map.addLayer(markers);
if(filtered.length>0&&(selectedState||selectedType||searchQuery)){
var bounds=L.latLngBounds(filtered.map(f=>[f.lat,f.lng]));
map.fitBounds(bounds,{padding:[40,40],maxZoom:10})}}
function selectFacility(f){
activeMarker=activeMarker===f.name?null:f.name;
var card=document.getElementById('facilityCard');
if(activeMarker){document.getElementById('cardName').textContent=f.name;
document.getElementById('cardMeta').textContent=f.city+', '+(SN[f.state]||f.state);
document.getElementById('cardBadges').innerHTML='<span class="card-badge" style="background:'+SC[f.state]+'20;color:'+SC[f.state]+'">'+SN[f.state]+'</span><span class="card-badge" style="background:'+TC[f.type]+'20;color:'+TC[f.type]+'">'+TL[f.type]+'</span>';
card.classList.add('visible');map.setView([f.lat,f.lng],Math.max(map.getZoom(),10),{animate:true})}
else{card.classList.remove('visible')}render()}
document.getElementById('cardClose').onclick=()=>{activeMarker=null;document.getElementById('facilityCard').classList.remove('visible');render()};
render();
</script>
</body>
</html>
