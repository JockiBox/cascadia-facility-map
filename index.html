<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cascadia Healthcare - Facility Network</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0f1a;color:#e2e8f0;overflow:hidden}

/* --- Header --- */
.header{
  background:linear-gradient(135deg,#0d1520 0%,#132030 100%);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 28px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1000;
}
.header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(42,157,165,0.4),rgba(196,146,42,0.4),transparent);
}
.header-left{display:flex;align-items:center;gap:16px}
.logo-mark{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#1B6B73,#2A9DA5);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:white;
  box-shadow:0 0 20px rgba(42,157,165,0.3);
}
.header-title{font-size:15px;font-weight:700;letter-spacing:2px;color:#e2e8f0}
.header-title span{color:#C4922A}
.header-sub{font-size:11px;color:#64748b;letter-spacing:1px;margin-top:1px}
.header-stats{display:flex;gap:32px}
.stat{text-align:center;position:relative}
.stat-value{
  font-size:28px;font-weight:800;
  background:linear-gradient(135deg,#2A9DA5,#C4922A);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.stat-label{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.stat+.stat::before{
  content:'';position:absolute;left:-16px;top:4px;bottom:4px;width:1px;
  background:rgba(255,255,255,0.08);
}

/* --- Layout --- */
.layout{display:flex;height:calc(100vh - 64px)}

/* --- Sidebar --- */
.sidebar{
  width:380px;
  background:linear-gradient(180deg,#0d1520 0%,#111827 100%);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-header{padding:20px 20px 16px;flex-shrink:0}
.search-wrap{position:relative}
.search-box{
  width:100%;padding:12px 16px 12px 42px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;font-size:14px;color:#e2e8f0;
  outline:none;transition:all 0.3s;font-family:'Inter',sans-serif;
}
.search-box::placeholder{color:#475569}
.search-box:focus{border-color:rgba(42,157,165,0.5);background:rgba(255,255,255,0.06);box-shadow:0 0 20px rgba(42,157,165,0.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#475569}

/* --- Filters --- */
.filters{padding:0 20px 16px;flex-shrink:0}
.filter-section{margin-bottom:12px}
.filter-label{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px}
.filter-btn{
  padding:6px 14px;border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.03);
  font-size:11px;color:#94a3b8;cursor:pointer;
  transition:all 0.25s;display:flex;align-items:center;gap:5px;
  font-family:'Inter',sans-serif;
}
.filter-btn:hover{border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#e2e8f0}
.filter-btn.active{
  background:linear-gradient(135deg,rgba(42,157,165,0.2),rgba(42,157,165,0.1));
  border-color:rgba(42,157,165,0.4);color:#5eead4;
}
.filter-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* --- List --- */
.count-badge{
  font-size:11px;color:#475569;padding:10px 20px;
  border-top:1px solid rgba(255,255,255,0.04);
  border-bottom:1px solid rgba(255,255,255,0.04);
  display:flex;align-items:center;justify-content:space-between;
}
.count-num{color:#2A9DA5;font-weight:700}
.facility-list{overflow-y:auto;flex:1;padding:4px 0}
.facility-list::-webkit-scrollbar{width:4px}
.facility-list::-webkit-scrollbar-track{background:transparent}
.facility-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px}
.facility-item{
  padding:12px 20px;cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;gap:12px;
  border-left:3px solid transparent;position:relative;
}
.facility-item::after{
  content:'';position:absolute;bottom:0;left:20px;right:20px;height:1px;
  background:rgba(255,255,255,0.03);
}
.facility-item:hover{background:rgba(255,255,255,0.03)}
.facility-item.active{
  background:linear-gradient(90deg,rgba(42,157,165,0.1),transparent);
  border-left-color:#2A9DA5;
}
.facility-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  box-shadow:0 0 6px currentColor;
}
.facility-info{flex:1;min-width:0}
.facility-name{font-size:13px;font-weight:600;color:#e2e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facility-meta{font-size:11px;color:#475569;margin-top:2px}
.facility-type{
  font-size:9px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,0.05);color:#64748b;
  flex-shrink:0;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;
}

/* --- Map --- */
.map-container{flex:1;position:relative;background:#0a0f1a}
#map{width:100%;height:100%}

/* Dark map overrides */
.leaflet-container{background:#0a0f1a!important}
.leaflet-control-zoom a{
  background:rgba(13,21,32,0.9)!important;color:#94a3b8!important;
  border-color:rgba(255,255,255,0.1)!important;
}
.leaflet-control-zoom a:hover{background:rgba(42,157,165,0.3)!important;color:white!important}
.leaflet-control-attribution{
  background:rgba(13,21,32,0.8)!important;color:#475569!important;font-size:10px!important;
}
.leaflet-control-attribution a{color:#64748b!important}
.leaflet-popup-content-wrapper{
  background:rgba(13,21,32,0.95)!important;color:#e2e8f0!important;
  border:1px solid rgba(255,255,255,0.1)!important;
  border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,0.5)!important;
}
.leaflet-popup-tip{background:rgba(13,21,32,0.95)!important}
.leaflet-tooltip{
  background:rgba(13,21,32,0.95)!important;color:#e2e8f0!important;
  border:1px solid rgba(255,255,255,0.1)!important;
  border-radius:8px!important;padding:8px 12px!important;
  box-shadow:0 4px 16px rgba(0,0,0,0.4)!important;font-size:12px!important;
}
.leaflet-tooltip::before{border-top-color:rgba(13,21,32,0.95)!important}

/* Cluster styling */
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{
  background:none!important;
}
.marker-cluster-small div{
  background:linear-gradient(135deg,#1B6B73,#2A9DA5)!important;
  color:white!important;font-weight:700!important;font-size:12px!important;
  width:36px!important;height:36px!important;margin:2px!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  box-shadow:0 0 15px rgba(42,157,165,0.4),0 2px 8px rgba(0,0,0,0.3)!important;
}
.marker-cluster-medium div{
  background:linear-gradient(135deg,#C4922A,#E8B84B)!important;
  color:white!important;font-weight:700!important;font-size:13px!important;
  width:42px!important;height:42px!important;margin:4px!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  box-shadow:0 0 20px rgba(196,146,42,0.4),0 2px 8px rgba(0,0,0,0.3)!important;
}
.marker-cluster-large div{
  background:linear-gradient(135deg,#7c3aed,#a78bfa)!important;
  color:white!important;font-weight:700!important;font-size:14px!important;
  width:48px!important;height:48px!important;margin:6px!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  box-shadow:0 0 25px rgba(124,58,237,0.4),0 2px 8px rgba(0,0,0,0.3)!important;
}

/* --- Detail card --- */
.facility-card{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(13,21,32,0.92);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,0.5);
  padding:20px 24px;z-index:800;
  min-width:320px;max-width:420px;
  opacity:0;pointer-events:none;
  transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
}
.facility-card.visible{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.card-header{display:flex;justify-content:space-between;align-items:start;gap:12px}
.card-name{font-size:17px;font-weight:700;color:#e2e8f0;line-height:1.3}
.card-close{
  cursor:pointer;color:#475569;font-size:20px;padding:2px 6px;
  border-radius:6px;transition:all 0.2s;flex-shrink:0;
}
.card-close:hover{color:#e2e8f0;background:rgba(255,255,255,0.06)}
.card-meta{font-size:13px;color:#64748b;margin-top:6px}
.card-badges{display:flex;gap:8px;margin-top:12px}
.card-badge{
  font-size:11px;padding:4px 12px;border-radius:8px;font-weight:600;
  border:1px solid;
}
.card-coords{font-size:11px;color:#475569;margin-top:10px;font-family:monospace}

/* --- Animated glow on markers --- */
@keyframes pulse-glow{
  0%,100%{box-shadow:0 0 4px currentColor}
  50%{box-shadow:0 0 12px currentColor,0 0 20px currentColor}
}

/* --- Mobile --- */
@media(max-width:768px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:40vh;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06)}
  .map-container{height:60vh}
  .header-stats{display:none}
  .facility-card{min-width:unset;left:16px;right:16px;transform:translateY(20px);bottom:16px}
  .facility-card.visible{transform:translateY(0)}
}
</style>
</head>

const SC={ID:'#2dd4bf',OR:'#f59e0b',WA:'#38bdf8',MT:'#a78bfa',AZ:'#fb923c',CA:'#f472b6'};
const SN={ID:'Idaho',OR:'Oregon',WA:'Washington',MT:'Montana',AZ:'Arizona',CA:'California'};
const TL={snf:'Skilled Nursing',alf:'Assisted Living',ilf:'Independent Living',hospice:'Hospice',corporate:'Corporate',healthcare:'Healthcare Co.'};
const TC={snf:'#2dd4bf',alf:'#f59e0b',ilf:'#a78bfa',hospice:'#f472b6',corporate:'#94a3b8',healthcare:'#38bdf8'};
let map,markers,activeMarker=null,selectedState=null,selectedType=null,searchQuery='';

// Dark map tiles (Stadia Dark)
map=L.map('map',{zoomControl:true}).setView([44.5,-117.0],6);
L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png',{
  attribution:'Stadia Maps, OpenStreetMap',maxZoom:18
}).addTo(map);

markers=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true,showCoverageOnHover:false,
  iconCreateFunction:function(c){
    var n=c.getChildCount(),cls=n>10?'large':n>5?'medium':'small';
    return L.divIcon({html:'<div>'+n+'</div>',className:'marker-cluster marker-cluster-'+cls,iconSize:L.point(n>10?60:n>5?50:40,n>10?60:n>5?50:40)})
  }
});

var states=[...new Set(facilities.map(f=>f.state))];
document.getElementById('totalCount').textContent=facilities.length;
document.getElementById('stateCount').textContent=states.length;
document.getElementById('snfCount').textContent=facilities.filter(f=>f.type==='snf').length;

// Build filters
var stateCounts={};facilities.forEach(f=>{stateCounts[f.state]=(stateCounts[f.state]||0)+1});
var sf=document.getElementById('stateFilters');
Object.entries(stateCounts).sort((a,b)=>b[1]-a[1]).forEach(([st,ct])=>{
  var b=document.createElement('button');b.className='filter-btn';b.dataset.state=st;
  b.innerHTML='<span class="filter-dot" style="background:'+SC[st]+';box-shadow:0 0 6px '+SC[st]+'"></span>'+SN[st]+' <span style="opacity:0.5">'+ct+'</span>';
  b.onclick=()=>{selectedState=selectedState===st?null:st;document.querySelectorAll('#stateFilters .filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.state===selectedState));render()};
  sf.appendChild(b)
});
var typeCounts={};facilities.forEach(f=>{typeCounts[f.type]=(typeCounts[f.type]||0)+1});
var tf=document.getElementById('typeFilters');
Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).forEach(([tp,ct])=>{
  var b=document.createElement('button');b.className='filter-btn';b.dataset.type=tp;
  b.innerHTML=TL[tp]+' <span style="opacity:0.5">'+ct+'</span>';
  b.onclick=()=>{selectedType=selectedType===tp?null:tp;document.querySelectorAll('#typeFilters .filter-btn').forEach(x=>x.classList.toggle('active',x.dataset.type===selectedType));render()};
  tf.appendChild(b)
});
document.getElementById('searchInput').addEventListener('input',function(e){searchQuery=e.target.value.toLowerCase();render()});

function getFiltered(){return facilities.filter(f=>{
  if(selectedState&&f.state!==selectedState)return false;
  if(selectedType&&f.type!==selectedType)return false;
  if(searchQuery&&!f.name.toLowerCase().includes(searchQuery)&&!f.city.toLowerCase().includes(searchQuery))return false;
  return true
})}

function render(){
  var filtered=getFiltered();
  document.getElementById('filteredNum').textContent=filtered.length;
  var fl=document.getElementById('filterLabel');
  fl.textContent=selectedState?SN[selectedState]:(selectedType?TL[selectedType]:'');

  var list=document.getElementById('facilityList');list.innerHTML='';
  filtered.forEach(f=>{
    var d=document.createElement('div');
    d.className='facility-item'+(activeMarker===f.name?' active':'');
    d.innerHTML='<div class="facility-dot" style="background:'+SC[f.state]+';color:'+SC[f.state]+'"></div><div class="facility-info"><div class="facility-name">'+f.name+'</div><div class="facility-meta">'+f.city+', '+f.state+'</div></div><div class="facility-type">'+f.type+'</div>';
    d.onclick=()=>selectFacility(f);
    d.onmouseenter=()=>{if(activeMarker!==f.name)d.querySelector('.facility-dot').style.animation='pulse-glow 1.5s infinite'};
    d.onmouseleave=()=>{d.querySelector('.facility-dot').style.animation='none'};
    list.appendChild(d)
  });

  markers.clearLayers();
  filtered.forEach(f=>{
    var color=SC[f.state]||'#999';
    var isActive=activeMarker===f.name;
    var m=L.circleMarker([f.lat,f.lng],{
      radius:isActive?12:7,
      fillColor:color,color:isActive?'white':color,
      weight:isActive?2.5:1.5,opacity:1,
      fillOpacity:isActive?1:0.75,
      className:'map-dot'
    });
    var tip='<strong style="color:'+color+'">'+f.name+'</strong><br><span style="color:#94a3b8">'+f.city+', '+f.state+' &middot; '+TL[f.type]+'</span>';
    m.bindTooltip(tip,{direction:'top',offset:[0,-8]});
    m.on('click',()=>selectFacility(f));
    markers.addLayer(m)
  });
  map.addLayer(markers);
  if(filtered.length>0&&(selectedState||selectedType||searchQuery)){
    map.fitBounds(L.latLngBounds(filtered.map(f=>[f.lat,f.lng])),{padding:[50,50],maxZoom:10})
  }
}

function selectFacility(f){
  activeMarker=activeMarker===f.name?null:f.name;
  var card=document.getElementById('facilityCard');
  if(activeMarker){
    document.getElementById('cardName').textContent=f.name;
    document.getElementById('cardMeta').textContent=f.city+', '+(SN[f.state]||f.state);
    var sc=SC[f.state],tc=TC[f.type];
    document.getElementById('cardBadges').innerHTML=
      '<span class="card-badge" style="background:'+sc+'15;color:'+sc+';border-color:'+sc+'30">'+SN[f.state]+'</span>'+
      '<span class="card-badge" style="background:'+tc+'15;color:'+tc+';border-color:'+tc+'30">'+TL[f.type]+'</span>';
    document.getElementById('cardCoords').textContent=f.lat.toFixed(4)+'N, '+Math.abs(f.lng).toFixed(4)+'W';
    card.classList.add('visible');
    map.flyTo([f.lat,f.lng],Math.max(map.getZoom(),10),{duration:0.8})
  } else {
    card.classList.remove('visible')
  }
  render()
}

document.getElementById('cardClose').onclick=()=>{
  activeMarker=null;
  document.getElementById('facilityCard').classList.remove('visible');
  render()
};

render();
</script>
